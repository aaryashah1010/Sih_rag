[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ipsakti-rag-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "beautifulsoup4>=4.13,<5.0",
  "httpx>=0.28,<1.0",
  "PyMuPDF>=1.25,<2.0",
  "PyYAML>=6.0,<7.0",
]

[project.scripts]
ipsakti-ingest = "rag_service.ingestion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
